# pubspec.yaml — LensIQ v1.0.0 — EXACT PINNED VERSIONS
# Rule: No ^ on Firebase/AdMob/Hive. No exceptions.

name: lensiq
description: LensIQ - See Through Everything
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── FIREBASE — EXACT PINS (no ^) ──────────────────────────────────
  firebase_core: 2.30.1
  firebase_analytics: 10.8.9
  firebase_crashlytics: 3.4.9
  cloud_firestore: 4.15.9
  firebase_remote_config: 4.4.4
  firebase_messaging: 14.7.19

  # ── ADMOB — EXACT PIN ──────────────────────────────────────────────
  google_mobile_ads: 4.0.0

  # ── NETWORKING ────────────────────────────────────────────────────
  http: 1.2.1
  dio: 5.4.3+1
  connectivity_plus: 5.0.2

  # ── AI ────────────────────────────────────────────────────────────
  google_generative_ai: 0.4.3

  # ── STATE MANAGEMENT ──────────────────────────────────────────────
  provider: 6.1.2

  # ── UI / ANIMATION ────────────────────────────────────────────────
  flutter_animate: 4.5.0
  lottie: 3.1.2
  cached_network_image: 3.3.1
  shimmer: 3.0.0
  fl_chart: 0.66.2
  flutter_svg: 2.0.10+1

  # ── PDF GENERATION ────────────────────────────────────────────────
  pdf: 3.10.8
  printing: 5.12.0

  # ── FILE SYSTEM ───────────────────────────────────────────────────
  path_provider: 2.1.3
  permission_handler: 11.3.1

  # ── SHARE / OPEN URLS ────────────────────────────────────────────
  share_plus: 9.0.0
  url_launcher: 6.2.6

  # ── LOCAL STORAGE ────────────────────────────────────────────────
  shared_preferences: 2.2.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # ── LOCATION ─────────────────────────────────────────────────────
  geolocator: 11.0.0
  geocoding: 3.0.0

  # ── IMAGE ────────────────────────────────────────────────────────
  image_picker: 1.1.1
  image: 4.1.7

  # ── QR CODE ──────────────────────────────────────────────────────
  qr_flutter: 4.1.0

  # ── NOTIFICATIONS ────────────────────────────────────────────────
  flutter_local_notifications: 17.2.1+2
  timezone: 0.9.4

  # ── DEEP LINKING ─────────────────────────────────────────────────
  app_links: 6.1.1

  # ── INTL / LOCALIZATION ──────────────────────────────────────────
  intl: 0.20.2

  # ── CLIPBOARD ────────────────────────────────────────────────────
  clipboard: 0.1.3

  # ── UUID ─────────────────────────────────────────────────────────
  uuid: 4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  hive_generator: 2.0.1
  build_runner: 2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
    - assets/icons/
