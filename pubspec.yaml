name: lensiq
description: LensIQ - See Through Everything
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_analytics: ^10.8.9
  firebase_crashlytics: ^3.4.9
  cloud_firestore: ^4.15.9
  firebase_remote_config: ^4.4.4
  firebase_messaging: ^14.7.19

  # AdMob
  google_mobile_ads: 4.0.0

  # Networking
  http: 1.2.1
  connectivity_plus: 5.0.2

  # AI
  google_generative_ai: 0.4.3

  # State Management
  provider: 6.1.2

  # UI / Animation
  flutter_animate: 4.5.0
  lottie: 3.1.2
  cached_network_image: 3.3.1
  shimmer: 3.0.0
  flutter_svg: 2.0.10+1

  # PDF Generation
  pdf: 3.10.8
  printing: 5.12.0

  # File System
  path_provider: 2.1.3
  permission_handler: 11.3.1

  # Share / URLs
  share_plus: 9.0.0
  url_launcher: 6.2.6

  # Local Storage
  shared_preferences: 2.2.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Image Picker
  image_picker: 1.1.1

  # QR Code
  qr_flutter: 4.1.0

  # Notifications
  flutter_local_notifications: 17.2.1+2
  timezone: 0.9.4

  # Deep Linking
  app_links: 6.1.1

  # Intl
  intl: ^0.20.2

  # UUID for anonymous IDs
  uuid: 4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  build_runner: 2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
    - assets/icons/
