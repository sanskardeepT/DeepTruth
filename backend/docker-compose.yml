version: '3.8'

services:
  api:
    build: .
    container_name: dt_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dt_user:dt_pass@db:5432/deeptruth
      - REDIS_URL=redis://cache:6379
    depends_on:
      - db
      - cache

  db:
    image: postgres:15-alpine
    container_name: dt_postgres
    environment:
      - POSTGRES_USER=dt_user
      - POSTGRES_PASSWORD=dt_pass
      - POSTGRES_DB=deeptruth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:alpine
    container_name: dt_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
